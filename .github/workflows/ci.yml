name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build pkg-config liblua5.4-dev libzstd-dev glslc mesa-vulkan-drivers xvfb

      - name: Build pinned SDL3 dependency
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output /tmp/SDL3-3.4.16.tar.gz
          tar --extract --gzip --file /tmp/SDL3-3.4.16.tar.gz --directory /tmp
          cmake -S /tmp/SDL3-3.4.16 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON
          cmake --build /tmp/SDL3-build --parallel 2 --verbose
          sudo cmake --install /tmp/SDL3-build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify shaderless fallback build
        run: |
          cmake -S . -B build-msdf-fallback -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROWL_ENABLE_GPU_MSDF=OFF
          cmake --build build-msdf-fallback --parallel
          ctest --test-dir build-msdf-fallback --output-on-failure -E rowl_player_gpu_msdf_smoke

      - name: Check managed dependencies for known vulnerabilities
        run: dotnet list editor/RowlEngine.Editor.csproj package --vulnerable --include-transitive

  windows:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native dependencies
        shell: pwsh
        run: vcpkg install sdl3 zstd lua nlohmann-json libvorbis --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path build/vcpkg_installed/x64-windows/debug/bin);$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Check managed dependencies for known vulnerabilities
        run: dotnet list editor/RowlEngine.Editor.csproj package --vulnerable --include-transitive
