<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0b">
  <title>Rowl — Çalışma alanı prototipi</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./tools.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="2"/><rect x="15" y="15" width="6" height="6" rx="2"/><path d="M6 9v7a2 2 0 0 0 2 2h7M9 6h7a2 2 0 0 1 2 2v7"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="m10 8 5 3-5 3ZM8 21h8M12 17v4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 0 0-2 2v5m0 4v5a2 2 0 0 0 2 2h5M14 3h5a2 2 0 0 1 2 2v5m-10 1 10 5-5 1-1 5Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 9a9 9 0 1 1 0 6M3 3v6h6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18m0-9h9"/></symbol>
    <symbol id="i-hierarchy" viewBox="0 0 24 24"><path d="M5 4v15h5M5 7h5M5 13h5"/><rect x="10" y="4" width="10" height="6" rx="2"/><rect x="10" y="16" width="10" height="6" rx="2"/></symbol>
    <symbol id="i-inspector" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/></symbol>
    <symbol id="i-assets" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 4h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-console" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18m-12-6 3-3 3 3m-6 12 3 3 3-3m-9-9-3 3 3 3m12-6 3 3-3 3"/></symbol>
  </svg>


  <header class="app-header">
    <span class="brand-mark" aria-label="Rowl">r.</span>
    <nav class="view-switcher" aria-label="Çalışma alanları">
      <button class="view-button" data-view="node" aria-label="Node ekranını aç" title="Node"><svg><use href="#i-node"/></svg><i></i></button>
      <button class="view-button" data-view="game" aria-label="Game ekranını aç" title="Game"><svg><use href="#i-game"/></svg><i></i></button>
      <button class="view-button" data-view="edit" aria-label="Edit Scene ekranını aç" title="Edit Scene"><svg><use href="#i-edit"/></svg><i></i></button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button class="view-button playback-button" id="play-toggle" aria-label="Oyunu başlat" title="Oyunu başlat"><svg aria-hidden="true"><use href="#i-play"/></svg></button>
      <button class="view-button playback-button" id="pause-toggle" aria-label="Oyunu duraklat" title="Oyunu duraklat" disabled><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
    </nav>
    <button class="icon-button" id="options" aria-label="Çalışma alanı seçenekleri" aria-expanded="false" aria-controls="options-menu" title="Seçenekler"><svg><use href="#i-more"/></svg></button>
    <div class="options-menu popover" id="options-menu" hidden>
      <span class="menu-label">PROJE</span>
      <button class="menu-row" data-settings="project"><svg><use href="#i-assets"/></svg>Proje ayarları</button>
      <button class="menu-row" data-settings="game"><svg><use href="#i-game"/></svg>Oyun ayarları</button>
      <button class="menu-row" data-settings="export"><svg><use href="#i-export"/></svg>Dışa aktar</button>
      <span class="menu-label menu-section">EDİTÖR</span>
      <button class="menu-row" data-settings="editor"><svg><use href="#i-inspector"/></svg>Editör tercihleri</button>
      <button class="menu-row" id="reset"><svg><use href="#i-reset"/></svg>Yerleşimi sıfırla</button>
    </div>
  </header>
  <main class="workspace" id="workspace" aria-label="Editör çalışma alanı"><div class="dock-root" id="dock-root"></div><div class="empty-state" id="empty-state" hidden><svg aria-hidden="true"><use href="#i-layout"/></svg><span>Üstteki simgelerden bir ekran aç.</span></div><div class="drop-preview" id="drop-preview" hidden><span></span></div><div class="drag-label" id="drag-label" hidden></div></main>
  <div class="placement-menu popover" id="placement-menu" hidden>
    <span class="menu-label" id="placement-title">Pencereyi yerleştir</span>
    <label for="placement-target">Hedef pencere</label>
    <select id="placement-target"></select>
    <div class="placement-directions" role="group" aria-label="Hedefe göre konum"><button data-edge="left">← Sol</button><button data-edge="right">Sağ →</button><button data-edge="top">↑ Üst</button><button data-edge="bottom">Alt ↓</button></div>
    <button class="menu-row" id="menu-pin"><svg><use href="#i-pin"/></svg><span>Paneli sabitle</span></button>
    <button class="menu-row" id="menu-close"><svg><use href="#i-close"/></svg>Pencereyi kapat</button>
  </div>
  <div class="tools-launcher">
    <div id="tools-menu" class="tool-shortcuts" hidden aria-label="Editör araçları">
      <button data-tool="hierarchy" aria-pressed="false"><span>Hiyerarşi</span><svg><use href="#i-hierarchy"/></svg></button>
      <button data-tool="inspector" aria-pressed="false"><span>Inspector</span><svg><use href="#i-inspector"/></svg></button>
      <button data-tool="assets" aria-pressed="false"><span>Varlıklar</span><svg><use href="#i-assets"/></svg></button>
      <button data-tool="console" aria-pressed="false"><span>Konsol</span><svg><use href="#i-console"/></svg></button>
    </div>
    <button id="tools-toggle" class="tools-toggle" aria-label="Araçları aç" aria-expanded="false" aria-controls="tools-menu"><svg><use href="#i-plus"/></svg></button>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <header class="dialog-header"><div><span class="tool-caption">ROWL / ÇALIŞMA ALANI</span><h2 id="settings-title"></h2></div><button type="button" class="icon-button" data-dismiss aria-label="Ayarları kapat"><svg><use href="#i-close"/></svg></button></header>
      <div class="dialog-body">
        <section data-settings-section="project"><label>Proje adı<input name="project" maxlength="80" required></label></section>
        <section data-settings-section="game"><label>Sahne çözünürlüğü<select name="resolution"><option value="1280x800">1280 × 800 · Yatay</option><option value="1920x1080">1920 × 1080 · Yatay</option><option value="1080x1920">1080 × 1920 · Dikey</option></select></label><label>Oyunun başlangıç sahnesi<select name="startScene"><option value="selected">Seçili node</option><option value="0">Bir gece, bir ışık</option><option value="1">Yol ayrımı</option><option value="2">Yeni bir sabah</option></select></label></section>
        <section data-settings-section="editor"><label class="check-row"><input type="checkbox" name="grid"> Node ızgarası</label><label class="check-row"><input type="checkbox" name="guides"> Edit Scene obje çerçeveleri</label></section>
        <section data-settings-section="export"><div class="export-card"><svg><use href="#i-export"/></svg><strong>Proje taslağı</strong><p>Sahneleri, obje özelliklerini, ayarları ve pencere yerleşimini JSON dosyası olarak indir.</p><span class="muted">Format · Rowl prototip JSON</span></div></section>
      </div>
      <footer class="dialog-footer"><button type="button" class="text-button" data-dismiss>Vazgeç</button><button type="submit" class="primary-button" id="settings-submit">Uygula</button></footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <template id="node-template">
    <div class="node-area">
      <div class="canvas-caption"><span>Hikâye akışı</span><span class="muted">03 sahne</span></div>
      <div class="graph-viewport"><div class="graph-world">
        <svg class="connections" viewBox="0 0 780 440" aria-hidden="true"><path d="M240 223C275 223 265 153 300 153M490 153C530 153 520 253 555 253"/><circle cx="240" cy="223" r="4"/><circle cx="300" cy="153" r="4"/><circle cx="490" cy="153" r="4"/><circle cx="555" cy="253" r="4"/></svg>
        <svg class="compact-connections" viewBox="0 0 260 560" aria-hidden="true"><path d="M130 170v35m0 150v35"/><circle cx="130" cy="170" r="4"/><circle cx="130" cy="205" r="4"/><circle cx="130" cy="355" r="4"/><circle cx="130" cy="390" r="4"/></svg>
        <button class="story-node node-0 selected" data-scene="0"><span class="node-type"><span class="tiny-dot"></span>BAŞLANGIÇ <span class="node-number">01</span></span><strong>Bir gece, bir ışık</strong><span class="node-description">Küçük bir yolculuğun ilk cümlesi.</span><span class="node-bottom">Mira <svg><use href="#i-arrow"/></svg></span></button>
        <button class="story-node node-1" data-scene="1"><span class="node-type"><span class="tiny-dot"></span>DİYALOG <span class="node-number">02</span></span><strong>Yol ayrımı</strong><span class="node-description">Bazen yönünü bulmak için durursun.</span><span class="node-bottom">Mira <svg><use href="#i-arrow"/></svg></span></button>
        <button class="story-node node-2" data-scene="2"><span class="node-type"><span class="tiny-dot"></span>FİNAL <span class="node-number">03</span></span><strong>Yeni bir sabah</strong><span class="node-description">Her hikâye bir iz bırakır.</span><span class="node-bottom">Mira <svg><use href="#i-check"/></svg></span></button>
      </div></div>
      <div class="canvas-bottom"><span class="canvas-note">Bir sahne seç, hikâyeyi gör.</span><div class="zoom-controls"><button class="icon-button" data-zoom="out" aria-label="Akışı uzaklaştır"><svg><use href="#i-minus"/></svg></button><span class="zoom-value">100%</span><button class="icon-button" data-zoom="in" aria-label="Akışı yakınlaştır"><svg><use href="#i-plus"/></svg></button><button class="icon-button" data-zoom="fit" aria-label="Akışı ekrana sığdır" title="Ekrana sığdır"><svg><use href="#i-fit"/></svg></button></div></div>
    </div>
  </template>
  <template id="scene-template">
    <div class="scene-area">
      <div class="scene-stage-wrap"><div class="game-frame">
<svg class="landscape" viewBox="0 0 800 650" preserveAspectRatio="xMidYMid slice" aria-label="Ay ışığında tepeler, örnek oyun sahnesi" role="img"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#292b36"/><stop offset="1" stop-color="#737078"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#797780"/><stop offset="1" stop-color="#373941"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h800v650H0z"/><g fill="#ece7d9"><circle cx="103" cy="58" r="1.5"/><circle cx="192" cy="108" r="1"/><circle cx="340" cy="55" r="1.5"/><circle cx="639" cy="67" r="1"/><circle cx="710" cy="180" r="1.5"/><circle cx="422" cy="198" r="1"/></g><path fill="#50515d" d="M0 348 155 182 304 339 428 249 651 375 800 260v390H0Z"/><path fill="#343640" d="M0 315 150 395 335 296 512 414 711 293 800 360v290H0Z"/><path fill="url(#water)" d="M0 434q200-57 400 0t400 0v216H0Z"/><g fill="none" stroke="#c3bdba" stroke-width="2" opacity=".23"><path d="M442 460h111m-133 15h142m-119 17h123m-160 22h181m-149 23h130"/></g><path fill="#24262c" d="M0 526q99-111 211-63l182 187H0Zm800-52q-93-23-157 54l-85 122h242Z"/><g fill="#17191e"><path d="m110 272-33 82h21l-31 64h87l-30-64h19Zm598 69-22 51h15l-23 45h59l-20-45h12Z"/><path d="M105 389h10v108h-10m598-71h8v68h-8"/></g></svg>
        <div class="scene-vignette"></div>
        <div class="scene-object moon-object" data-object="moon"><span class="object-label">Ay</span></div>
        <div class="scene-object character-object" data-object="character"><svg viewBox="0 0 100 220" aria-hidden="true"><ellipse cx="50" cy="207" rx="35" ry="8" fill="#0004"/><path d="M35 103 29 175h13l6-45 5 45h15l-7-72Z" fill="#24252e"/><path d="M35 70q15-13 30 0l9 48-24-7-25 7Z" fill="#d5d1c3"/><path d="m30 74-13 46 8 4 17-41m21-9 19 38-7 4-20-35" fill="#d5d1c3"/><circle cx="50" cy="49" r="18" fill="#d6c8bb"/><path d="M30 55q-11-40 21-35 32-1 21 43L60 41 40 37Z" fill="#282831"/><path d="M37 173h-9v8h16v-8m10 0h13v8H53Z" fill="#15161b"/></svg><span class="object-label">Mira</span></div>
        <div class="scene-object dialogue-box" data-object="dialogue"><div class="speaker-row"><span class="speaker-avatar">M</span><span class="speaker-name">Mira</span><span class="dialogue-line"></span></div><p class="dialogue-text"></p><button class="continue-button" data-continue aria-label="Sonraki örnek sahneye geç">Devam et <svg><use href="#i-arrow"/></svg></button><span class="object-label">Diyalog</span></div>
      </div></div>
      <div class="scene-bottom"><span class="scene-title"></span><span class="scene-help"></span></div>
    </div>
  </template>
  <script type="module" src="./app.js"></script>
</body>
</html>
