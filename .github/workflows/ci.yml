name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build pkg-config liblua5.4-dev libzstd-dev

      - name: Build pinned SDL3 dependency
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.2.30/SDL3-3.2.30.tar.gz \
            --output /tmp/SDL3-3.2.30.tar.gz
          tar --extract --gzip --file /tmp/SDL3-3.2.30.tar.gz --directory /tmp
          cmake -S /tmp/SDL3-3.2.30 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=OFF
          cmake --build /tmp/SDL3-build --parallel 2 --verbose
          sudo cmake --install /tmp/SDL3-build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check managed dependencies for known vulnerabilities
        run: dotnet list editor/RowlEngine.Editor.csproj package --vulnerable --include-transitive
