name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Sanitizer tam-süit (soak/stres dahil) nightly; PR/push'ta hızlı alt-küme (T0).
    - cron: '23 2 * * *'

permissions:
  contents: read
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Portability lint
        # T0 tripwire: tek-satırlık __has_feature + tests/'te guardsız
        # POSIX include. Ürün derlemez değil, kapı kızarır.
        run: bash tools/check_portability.sh

      - name: Install native build dependencies
        # ffmpeg: converter/author-guide fixture generation (test-only,
        # call-only; production encode ban in MEDIA_CONVERTERS_CONTRACT.md
        # is untouched). freetype/harfbuzz/fribidi/unibreak: native text
        # shaping backend (without them the build falls back to stb and the
        # shaping xUnit contract goes red).
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build pkg-config liblua5.4-dev libzstd-dev libvorbis-dev libogg-dev libpng-dev libwebp-dev ffmpeg libfreetype-dev libharfbuzz-dev libfribidi-dev libunibreak-dev libvulkan-dev glslc mesa-vulkan-drivers xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxss-dev libxtst-dev libxfixes-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Fetch pinned SDL3 tarball
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output /tmp/SDL3-3.4.16.tar.gz

      - name: Extract SDL3 sources
        run: |
          tar --extract --gzip --file /tmp/SDL3-3.4.16.tar.gz --directory /tmp

      - name: Configure SDL3 dependency
        run: |
          cmake -S /tmp/SDL3-3.4.16 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON

      - name: Build pinned SDL3 dependency
        run: |
          cmake --build /tmp/SDL3-build --parallel 2 --verbose

      - name: Install SDL3 dependency
        run: |
          sudo cmake --install /tmp/SDL3-build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Check additive-only C ABI
        # Additive-only C ABI gate; additions warn, removals fail.
        run: python3 tools/check_abi_additive.py build/lib/libRowlEngineCore.so tools/abi_baseline.txt

      - name: Test
        # 493 erken-dur: asili testi hizli isaretciye cevirir (windows
        # deseniyle ayni --timeout 300); ciktiyla duser, isi yakmaz.
        #
        # BUTCE: benchmark JSON'u bu turun YAN URUNU olarak yazilir. Olcum
        # icin ayri bir ikili kosusu calistirilmiyordu; o, ayni paketin tam
        # tekraydi (run 36617943963'de 458 s'lik benchmark adiminin ~327 s'i
        # daha once kosmus ctest'in tekraridi). Olcum sirasi korunur:
        # g_transitionFps bu ikilinin icinde, benchmark'tan ONCE doldugu
        # icin metrik kaybolmaz. Ayri bir surece tasinsaydi null olur ve
        # compare_benchmarks o metrigi sessizce atlayardi - yani bir kapi
        # kaybolurdu.
        env:
          ROWL_BENCHMARK_JSON: ${{ github.workspace }}/benchmark-results/linux-native.json
          ROWL_BENCHMARK_BUILD_ID: ${{ github.sha }}
          ROWL_BENCHMARK_BUILD_TYPE: Debug
          ROWL_BENCHMARK_MACHINE: ${{ runner.arch }}
        run: |
          mkdir -p benchmark-results
          xvfb-run -a ctest --test-dir build --output-on-failure --timeout 1800

      - name: Check release launcher parity (linux/windows)
        # Runs here, on Linux, so the Windows packaging step -- which
        # cannot be executed from a Linux runner -- is still covered by a
        # gate that fails fast in this job. Asserts statically that every
        # step running tools/verify_release_package.py also emits a
        # launcher via tools/make_release_launchers.py, with a platform
        # matching its runner, and that the emitted names still match the
        # names the verifier accepts.
        run: python3 tools/check_release_launcher_parity.py

      - name: Verify standalone package and VFS smoke
        run: |
          release_dir="$RUNNER_TEMP/rowl-release"
          mkdir -p "$release_dir/Assets/packages" "$release_dir/mods"
          python3 tools/package_assets.py Assets "$release_dir/Assets/packages/game.rowlpkg"
          cp build/bin/rowl_player "$release_dir/RowlGame"
          cp build/lib/libRowlEngineCore.so "$release_dir/"
          # Launchers are produced by the shared helper, not inlined here.
          # Both platform steps call tools/make_release_launchers.py so the
          # launcher content has exactly one source; before that, only the
          # Linux step knew how to write one and the Windows step shipped a
          # release with no launcher at all. --platform both keeps the
          # portable pair (byte-identical to the previous inline heredoc +
          # printf) so the artifact contents do not change.
          python3 tools/make_release_launchers.py "$release_dir" --platform both
          printf '# Rowl Engine mods\n' > "$release_dir/mods/README.md"
          printf 'ROWL ENGINE — STANDALONE GAME RELEASE\n' > "$release_dir/README.txt"
          cp packaging/THIRD_PARTY_NOTICES.md "$release_dir/THIRD_PARTY_NOTICES.md"
          python3 tools/verify_release_package.py "$release_dir"
          (
            cd "$release_dir"
            SDL_AUDIODRIVER=dummy LD_LIBRARY_PATH=. python3 "$GITHUB_WORKSPACE/tools/measure_ci_time.py" --label linux-package-smoke --threshold 1800 -- timeout 1800s xvfb-run -a ./RowlGame --project . --package-smoke-test
          )

      - name: Record native benchmark baseline
        # Olcum "Test" adiminda yapildi; burada yalnizca dosyayi ozete koyuyoruz.
        # Ikinci kez rowl_tests calistirmak 458 s harcadi ve hicbir yeni
        # dogrulama uretmiyordu.
        run: |
          if [ ! -s benchmark-results/linux-native.json ]; then
            echo "::error::benchmark JSON missing - Test adimi olcumu uretmedi"
            exit 1
          fi
          cat benchmark-results/linux-native.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-benchmark
          path: benchmark-results/linux-native.json

      - name: Compare native benchmark with previous baseline
        # Fail gate (Linux-only; Windows keeps ROWL_PERF_FLOOR=report):
        # exit 0 = compatible comparison or incompatible-or-missing-baseline
        # skip, exit 2 = regression breach beyond --fail-percent.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          PREV_ID=$(gh run list --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$PREV_ID" ]; then
            echo "[BenchmarkCompare] no previous successful run; skipping comparison."
            exit 0
          fi
          rm -rf /tmp/prev-bench && mkdir -p /tmp/prev-bench
          if ! gh run download "$PREV_ID" -n linux-native-benchmark -D /tmp/prev-bench; then
            echo "[BenchmarkCompare] previous baseline artifact unavailable; skipping."
            exit 0
          fi
          PREV_JSON=$(find /tmp/prev-bench -name '*.json' | head -n 1)
          if [ -z "$PREV_JSON" ]; then
            echo "[BenchmarkCompare] empty baseline artifact; skipping."
            exit 0
          fi
          python3 tools/compare_benchmarks.py "$PREV_JSON" \
            benchmark-results/linux-native.json --warn-percent 20 --fail-percent 35

      - name: Record editor benchmark baseline
        run: |
          mkdir -p benchmark-results
          ROWL_EDITOR_BENCHMARK_BUILD_ID="$GITHUB_SHA" \
          ROWL_EDITOR_BENCHMARK_BUILD_TYPE=Debug \
          ROWL_EDITOR_BENCHMARK_MACHINE="$(uname -m)" \
          ROWL_EDITOR_BENCHMARK_JSON="$GITHUB_WORKSPACE/benchmark-results/linux-editor.json" \
          SDL_AUDIODRIVER=dummy \
          xvfb-run -a dotnet test editor/Tests/RowlEngine.Editor.Tests.csproj \
            --configuration Debug --logger "console;verbosity=normal"
          cat "$GITHUB_WORKSPACE/benchmark-results/linux-editor.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload editor benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: linux-editor-benchmark
          path: benchmark-results/linux-editor.json

      - name: Verify shaderless fallback build
        # Bu adim linux isinde IKINCI ctest turunu calistirir (ilk tur "Test"
        # adiminda, ci.yml:96). Iki tur ayni $HOME'u paylasirken kayit dosyalari
        # kalici kullanici veri dizininde (XDG_DATA_HOME -> rowl-engine/saves)
        # yasar. Bir testin biraktigi slot, sonraki turun ayni slotu "bos" bekleyen
        # assertion'ini kirar; bu tam olarak P1-7 -> MS-6 kirilmasinin yolu.
        # Izole XDG_DATA_HOME bu sinifi kalici olarak kapatir: iki turun veri
        # dizini artik kesismez. Not: absolute yol sart (user_data_directories.cpp
        # goreli XDG'yi sessizce yok sayar), o yuzden $RUNNER_TEMP mutlaka
        # absolute.
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/rowl-xdg-fallback
        run: |
          mkdir -p "$XDG_DATA_HOME"
          cmake -S . -B build-msdf-fallback -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROWL_ENABLE_GPU_MSDF=OFF
          cmake --build build-msdf-fallback --parallel
          xvfb-run -a ctest --test-dir build-msdf-fallback --output-on-failure --timeout 1800 -E rowl_player_gpu_msdf_smoke

      - name: Check managed dependencies for known vulnerabilities
        run: |
          dotnet list editor/RowlEngine.Editor.csproj package --vulnerable --include-transitive
          dotnet list editor/Tests/RowlEngine.Editor.Tests.csproj package --vulnerable --include-transitive

  sanitizer:
    # PR/push'ta hızlı alt-küme (T0 katmanlama): soak/stres nightly'dadır.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build pkg-config liblua5.4-dev libzstd-dev libvorbis-dev libogg-dev libpng-dev libwebp-dev libfreetype-dev libharfbuzz-dev libfribidi-dev libunibreak-dev libvulkan-dev glslc mesa-vulkan-drivers xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxss-dev libxtst-dev libxfixes-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Fetch pinned SDL3 tarball
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output /tmp/SDL3-3.4.16.tar.gz

      - name: Extract SDL3 sources
        run: |
          tar --extract --gzip --file /tmp/SDL3-3.4.16.tar.gz --directory /tmp

      - name: Configure SDL3 dependency
        run: |
          cmake -S /tmp/SDL3-3.4.16 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON

      - name: Build pinned SDL3 dependency
        run: |
          cmake --build /tmp/SDL3-build --parallel 2 --verbose

      - name: Install SDL3 dependency
        run: |
          sudo cmake --install /tmp/SDL3-build

      # No .NET setup: editor tests are out of sanitizer scope, which covers native rowl_tests only.
      - name: Configure with sanitizers
        # Leak detection is intentionally off (detect_leaks=0 scope note):
        # ASan+UBSan only, LSan is follow-up work.
        run: |
          cmake -S . -B build-sanitizer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build native tests only
        # Build only the rowl_tests subset to keep the sanitizer job fast and focused on native tests.
        run: cmake --build build-sanitizer --target rowl_tests --parallel 2

      - name: Test under ASan and UBSan (fast subset)
        # GPU smoke is excluded: it needs a real GPU/display and is unreliable under sanitizers.
        # ROWL_SKIP_LONG_TESTS: soak/stres bölümü nightly süite aittir (T0).
        env:
          ROWL_SKIP_LONG_TESTS: '1'
        run: |
          ASAN_OPTIONS=halt_on_error=1:print_stacktrace=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-sanitizer -R "rowl_native_tests|rowl_benchmark_tool_tests" --output-on-failure --timeout 1800

  sanitizer-nightly:
    # Tam süit (soak/stres dahil), yalnızca schedule'da koşar (T0).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build pkg-config liblua5.4-dev libzstd-dev libvorbis-dev libogg-dev libpng-dev libwebp-dev libfreetype-dev libharfbuzz-dev libfribidi-dev libunibreak-dev libvulkan-dev glslc mesa-vulkan-drivers xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxss-dev libxtst-dev libxfixes-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Fetch pinned SDL3 tarball
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output /tmp/SDL3-3.4.16.tar.gz

      - name: Extract SDL3 sources
        run: |
          tar --extract --gzip --file /tmp/SDL3-3.4.16.tar.gz --directory /tmp

      - name: Configure SDL3 dependency
        run: |
          cmake -S /tmp/SDL3-3.4.16 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON

      - name: Build pinned SDL3 dependency
        run: |
          cmake --build /tmp/SDL3-build --parallel 2 --verbose

      - name: Install SDL3 dependency
        run: |
          sudo cmake --install /tmp/SDL3-build

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-sanitizer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build native tests only
        run: cmake --build build-sanitizer --target rowl_tests --parallel 2

      - name: Test under ASan and UBSan (full suite, perf floors report-only)
        # Sanitizer yavaslamasi (~2.2x, hosted runner'da dalgali) zaman tavanlarini
        # sistematik asar; tavan kapisi native linux/benchmark-compare islerinin
        # konusudur. Bellek/UB/boyut kilitleri enforce kalir (TSan isiyle ayni desen).
        run: |
          ROWL_PERF_FLOOR=report ASAN_OPTIONS=halt_on_error=1:print_stacktrace=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-sanitizer -R "rowl_native_tests|rowl_benchmark_tool_tests" --output-on-failure --timeout 1800

  tsan-nightly:
    # K6 (B3b): ThreadSanitizer tam-süit, yalnızca schedule'da koşar.
    # ASan'la aynı işte koşamaz (runtime'lar çakışır), o yüzden ayrı iş.
    # Kanıt (B3b): yerel TSan derlemesi temiz + kasıtlı-yarış kırmızı-kanıtlı
    # + tam-süit 0 TSan uyarısı. Zamanlama-tavanları TSan yavaşlatmasında
    # sistematik aşılır → ROWL_PERF_FLOOR=report (Windows CI deseni); tavan
    # kapısı benchmark-compare işinin konusudur, TSan'ın değil.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl ninja-build pkg-config liblua5.4-dev libzstd-dev libvorbis-dev libogg-dev libpng-dev libwebp-dev libfreetype-dev libharfbuzz-dev libfribidi-dev libunibreak-dev libvulkan-dev glslc mesa-vulkan-drivers xvfb libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxss-dev libxtst-dev libxfixes-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Fetch pinned SDL3 tarball
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output /tmp/SDL3-3.4.16.tar.gz

      - name: Extract SDL3 sources
        run: |
          tar --extract --gzip --file /tmp/SDL3-3.4.16.tar.gz --directory /tmp

      - name: Configure SDL3 dependency
        run: |
          cmake -S /tmp/SDL3-3.4.16 -B /tmp/SDL3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON

      - name: Build pinned SDL3 dependency
        run: |
          cmake --build /tmp/SDL3-build --parallel 2 --verbose

      - name: Install SDL3 dependency
        run: |
          sudo cmake --install /tmp/SDL3-build

      - name: Configure with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build native tests only
        run: cmake --build build-tsan --target rowl_tests --parallel 2

      - name: Test under TSan (full suite, perf floors report-only)
        run: |
          ROWL_PERF_FLOOR=report TSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-tsan -R "rowl_native_tests|rowl_benchmark_tool_tests" --output-on-failure --timeout 1800

  linux-arm64-compile:
    # Compile-only portability gate. It does not claim GUI, audio-device or
    # physical-device validation for an eventual ARM64 product package.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Assert native ARM64 runner
        run: |
          test "$(uname -m)" = "aarch64"
          uname -a

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl file ninja-build pkg-config liblua5.4-dev libzstd-dev libvorbis-dev libogg-dev libpng-dev libwebp-dev libvulkan-dev glslc libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxss-dev libxtst-dev libxfixes-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev wayland-protocols libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Fetch and build pinned SDL3 dependency
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output "$RUNNER_TEMP/SDL3-3.4.16.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/SDL3-3.4.16.tar.gz" --directory "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-3.4.16" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON
          cmake --build "$RUNNER_TEMP/SDL3-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SDL3-build"

      - name: Compile native runtime and tests
        run: |
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-arm64 --parallel 2

      - name: Verify ARM64 artifacts
        run: |
          file build-arm64/lib/libRowlEngineCore.so build-arm64/bin/rowl_player build-arm64/bin/rowl_tests
          file build-arm64/lib/libRowlEngineCore.so | grep -q 'ARM aarch64'
          file build-arm64/bin/rowl_player | grep -q 'ARM aarch64'
          file build-arm64/bin/rowl_tests | grep -q 'ARM aarch64'

      - name: Upload ARM64 compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-compile-artifacts
          path: |
            build-arm64/lib/libRowlEngineCore.so
            build-arm64/bin/rowl_player
            build-arm64/bin/rowl_tests

  macos-arm64-compile:
    # Compile-only gate (D1). No CTest here: no display server and no code
    # signature on the hosted runner, so this job proves the native macOS
    # arm64 build only — not GUI, audio-device or signed-package validation.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Assert native ARM64 runner
        run: |
          test "$(uname -m)" = "arm64"
          uname -a

      - name: Install native build dependencies
        run: |
          brew install lua zstd libvorbis libogg libpng webp pkg-config cmake ninja

      - name: Fetch and build pinned SDL3 dependency
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output "$RUNNER_TEMP/SDL3-3.4.16.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/SDL3-3.4.16.tar.gz" --directory "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-3.4.16" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_GPU=ON
          cmake --build "$RUNNER_TEMP/SDL3-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/SDL3-build"

      - name: Compile native runtime and tests
        run: |
          cmake -S . -B build-macos-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-macos-arm64 --parallel 2

      - name: Verify ARM64 Mach-O artifacts
        run: |
          file build-macos-arm64/lib/libRowlEngineCore.dylib build-macos-arm64/bin/rowl_player build-macos-arm64/bin/rowl_tests
          file build-macos-arm64/lib/libRowlEngineCore.dylib | grep -q 'Mach-O.*arm64'
          file build-macos-arm64/bin/rowl_player | grep -q 'Mach-O.*arm64'
          file build-macos-arm64/bin/rowl_tests | grep -q 'Mach-O.*arm64'

      - name: Check additive-only C ABI (Mach-O)
        # Portable ABI gate'in Mach-O dali (nm -gU / llvm-nm);
        # Linux'taki ELF cagrisi ile ayni betik, ayni baseline.
        run: python3 tools/check_abi_additive.py build-macos-arm64/lib/libRowlEngineCore.dylib tools/abi_baseline.txt

      - name: Upload macOS ARM64 compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-compile-artifacts
          path: |
            build-macos-arm64/lib/libRowlEngineCore.dylib
            build-macos-arm64/bin/rowl_player
            build-macos-arm64/bin/rowl_tests

  windows:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native dependencies
        # libogg/libpng/libwebp: host converter tools (tools/CMakeLists.txt)
        # resolve them via pkg-config, exactly like the Linux/macOS jobs.
        shell: pwsh
        run: vcpkg install sdl3 zstd lua nlohmann-json libogg libvorbis libpng libwebp freetype harfbuzz fribidi libunibreak --triplet x64-windows

      - name: Install pkg-config and ffmpeg for host tools
        shell: pwsh
        run: choco install pkgconfiglite ffmpeg -y --no-progress

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          # Native (non-zero) exit must stop the step: without this pwsh
          # logs a failed pre-flight and configures anyway (tur-6: the
          # missing libunibreak module scrolled by unnoticed).
          $ErrorActionPreference = "Stop"
          # Point pkg-config at the vcpkg .pc files (classic or manifest
          # layout) before CMake's FindPkgConfig runs for tools/.
          # The pre-flight check fails fast with a clear log if a module
          # is missing, instead of a bare CMake configure error.
          # Shaping modules are INTENTIONALLY absent here: every one of
          # them has a per-library cmake fallback (pkg-config module, else
          # find_library/find_path — libunibreak ships no .pc file at all)
          # and the EditorTextShapingSlice3 backend assertion is that gate.
          # A strict pre-flight entry would false-red exactly the case the
          # fallback exists for (tur-6 lesson). vorbisfile IS listed:
          # test_converters.py has no fallback.
          $pcDirs = @("$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig", "build/vcpkg_installed/x64-windows/lib/pkgconfig")
          $env:PKG_CONFIG_PATH = ($pcDirs -join ';')
          pkg-config --modversion vorbisenc vorbis vorbisfile ogg libwebpdecoder libpng
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Check additive-only C ABI (Windows PE)
        # Portable ABI gate'in Windows dali (dumpbin /EXPORTS -> llvm-nm ->
        # nm; COFF .lib/.obj icin llvm-nm -> nm); Linux ELF / macOS Mach-O
        # cagrilariyla ayni betik, ayni baseline (491).
        shell: pwsh
        run: python tools/check_abi_additive.py build/bin/RowlEngineCore.dll tools/abi_baseline.txt

      - name: Test
        shell: pwsh
        run: |
          $debugBin = 'build/vcpkg_installed/x64-windows/debug/bin'
          if (-not (Test-Path $debugBin)) { $debugBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/debug/bin" }
          # Tur-10: host tools link the RELEASE pkg-config libs
          # (PKG_CONFIG_PATH points at .../lib/pkgconfig) while the Debug
          # engine needs debug/bin. vorbis/ogg debug DLLs keep release
          # names, so rowl_oggenc always resolved; libpng/zlib rename
          # theirs (libpng16d/zd), leaving rowl_webp2png's release
          # libpng16.dll/zlib1.dll unresolvable -- the loader parked
          # pre-main on a missing-DLL dialog (CI-9 pre-flight hang).
          # Release bin goes SECOND so debug-linked binaries keep
          # resolving their debug DLLs first; it only fills the gaps.
          $releaseBin = 'build/vcpkg_installed/x64-windows/bin'
          if (-not (Test-Path $releaseBin)) { $releaseBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" }
          $env:PATH = "$((Resolve-Path $debugBin).Path);$((Resolve-Path $releaseBin).Path);$env:PATH"
          # test_converters.py shells out to pkg-config itself; the
          # Configure-step PKG_CONFIG_PATH does not persist across steps,
          # so re-export it here (tur-6: empty cflags -> missing
          # vorbis/vorbisfile.h).
          $pcDirs = @("$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/pkgconfig", "build/vcpkg_installed/x64-windows/lib/pkgconfig")
          $env:PKG_CONFIG_PATH = ($pcDirs -join ';')
          # Software rasterizer on the hosted runner cannot sustain the
          # transition-benchmark FPS floor; report there, enforce on dev hw.
          $env:ROWL_PERF_FLOOR = "report"
          ctest --test-dir build --output-on-failure --timeout 1800

      - name: Verify standalone package and VFS smoke
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'rowl-release'
          New-Item -ItemType Directory -Force -Path (Join-Path $release 'Assets/packages'), (Join-Path $release 'mods') | Out-Null
          python tools/package_assets.py Assets (Join-Path $release 'Assets/packages/game.rowlpkg')
          Copy-Item build/bin/rowl_player.exe (Join-Path $release 'RowlGame.exe')
          Copy-Item build/bin/RowlEngineCore.dll $release
          $dllSrc = 'build/vcpkg_installed/x64-windows/debug/bin'
          if (-not (Test-Path $dllSrc)) { $dllSrc = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/debug/bin" }
          Copy-Item (Join-Path $dllSrc '*.dll') $release
          # Shared with the Linux packaging step: the launcher content lives
          # in tools/make_release_launchers.py so the two platforms cannot
          # drift. This step previously wrote NO launcher, so the release
          # reached tools/verify_release_package.py without run_game.sh or
          # run_game.bat and the gate failed with "missing release launcher".
          python tools/make_release_launchers.py $release --platform windows
          Set-Content -NoNewline (Join-Path $release 'mods/README.md') '# Rowl Engine mods'
          Set-Content -NoNewline (Join-Path $release 'README.txt') 'ROWL ENGINE — STANDALONE GAME RELEASE'
          Copy-Item packaging/THIRD_PARTY_NOTICES.md $release
          python tools/verify_release_package.py $release
          Push-Location $release
          $env:SDL_AUDIODRIVER = 'dummy'
          .\RowlGame.exe --project . --package-smoke-test
          Pop-Location

      - name: Check managed dependencies for known vulnerabilities
        run: |
          dotnet list editor/RowlEngine.Editor.csproj package --vulnerable --include-transitive
          dotnet list editor/Tests/RowlEngine.Editor.Tests.csproj package --vulnerable --include-transitive
